<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
    body {
      margin: 200px;
    }
    
    div {
      background-color: blue;
      height: 300px;
      width: 500px;
    }

    .red-circle {
      background-color: red;
      height: 150px;
      width: 150px;
      border-radius: 100px;
      justify-content: center;
      align-items: flex-end;
    }

  

  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
